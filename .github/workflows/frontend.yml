name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths: ['src/**', 'package.json', 'vite.config.ts', 'tsconfig.json']
  pull_request:
    paths: ['src/**', 'package.json', 'vite.config.ts', 'tsconfig.json']

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3000
          VITE_PAYSTACK_PUBLIC_KEY: pk_test_placeholder
